<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Match Find — 今晚看什麼</title>
<meta name="description" content="英超、MLS、MLB、NBA、F1 賽程，依精彩程度與競爭程度推薦，並換算成你的當地時間。" />
<link rel="icon" href="data:," />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="page-header">
    <div class="page-header-inner">
      <div class="page-header-row">
        <div>
          <h1>Match Find</h1>
          <p class="tagline">值得你空出時間的那一場比賽</p>
        </div>
        <button id="settings-btn" class="settings-btn" type="button" aria-label="設定">⚙</button>
      </div>
      <p class="clock" id="local-clock" aria-live="off"></p>
    </div>
  </header>

  <div id="settings-backdrop" class="settings-backdrop" hidden></div>
  <div id="settings-panel" class="settings-panel" hidden role="dialog" aria-label="賽事優先順序設定">
    <div class="settings-panel-header">
      <h2>賽事優先順序</h2>
      <button id="settings-close-btn" type="button" aria-label="關閉">✕</button>
    </div>
    <p class="settings-hint">時間衝突、精彩程度相近時，優先顯示你偏好的運動。</p>
    <div id="settings-sport-list" class="settings-sport-list"></div>
    <button id="settings-reset-btn" type="button" class="settings-reset">重設為預設值</button>
  </div>

  <main id="app" hidden>
    <section id="day-scroller-section">
      <div id="day-scroller" class="day-scroller" role="tablist" aria-label="選擇日期"></div>
    </section>

    <section id="filters-section">
      <div id="sport-filters" class="filter-row" role="group" aria-label="依運動篩選"></div>
    </section>

    <section id="recommended-section">
      <h2 class="section-label"><span data-day-label></span>推薦賽事</h2>
      <div id="recommended-list"></div>
      <p id="recommended-empty" class="empty-state" hidden>
        這一天沒有特別推薦的賽事，也可能都在深夜時段——本站不會把深夜賽事列為必看推薦。
      </p>
    </section>

    <section id="all-matches-section">
      <h2 class="section-label"><span data-day-label></span>所有賽事</h2>
      <div id="all-match-list"></div>
      <p id="all-empty" class="empty-state" hidden>這一天沒有找到任何賽事。</p>
    </section>
  </main>

  <p id="empty-state" class="empty-state" hidden>
    近期沒有找到即將開始的賽事，請稍後再回來看看。
  </p>
  <p id="error-state" class="empty-state" hidden>
    無法載入賽事資料，網站可能正在建置第一批資料，請稍後再試一次。
  </p>

  <footer class="page-footer">
    <p id="generated-note"></p>
    <p>賽程資料來自 ESPN 公開 API．推薦內容由 Gemini AI 透過共用代理伺服器產生．每數小時自動更新一次。</p>
  </footer>

  <div id="update-banner" class="update-banner" hidden role="status">
    <span>網站已推出新版本</span>
    <button id="update-reload-btn" type="button">重新整理</button>
  </div>

  <template id="match-card-template">
    <article class="match-card">
      <div class="match-time">
        <span class="match-time-value"></span>
        <span class="match-time-end"></span>
        <span class="match-time-relative"></span>
      </div>
      <div class="match-body">
        <div class="match-heading">
          <span class="sport-badge"></span>
          <span class="recommended-tag" hidden>推薦</span>
        </div>
        <div class="teams" data-teams></div>
        <p class="match-venue"></p>
        <p class="match-watch" hidden><span class="watch-icon" aria-hidden="true">📺</span><span class="watch-text"></span></p>
        <div class="score-row">
          <div class="score-meter">
            <span class="score-label">競爭度</span>
            <div class="meter"><div class="meter-fill competitiveness-fill"></div></div>
          </div>
          <div class="score-meter">
            <span class="score-label">精彩度</span>
            <div class="meter"><div class="meter-fill watchability-fill"></div></div>
          </div>
        </div>
        <p class="match-reason"></p>
        <p class="conflict-note" hidden></p>
      </div>
    </article>
  </template>

  <template id="team-row-template">
    <div class="team-row">
      <span class="team-side"></span>
      <img class="team-logo" alt="" loading="lazy" referrerpolicy="no-referrer" />
      <span class="team-name-en"></span>
      <span class="team-name-zh"></span>
    </div>
  </template>

  <script src="./app.js"></script>
</body>
</html>
