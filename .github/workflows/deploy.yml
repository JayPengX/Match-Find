# Deploys the static site (public/) to GitHub Pages on every push to main.
# No scheduled data build here anymore - the match list is now fetched and
# scored LIVE, in every viewer's own browser (see public/app.js's own top
# comment, and public/lib/match-builder.mjs), not by a scheduled rebuild of
# a static matches.json this workflow used to run every 15 minutes and
# redeploy. This workflow's only job now is shipping CODE changes (repo
# Settings -> Pages -> Source: GitHub Actions).
name: Deploy to Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:
    inputs:
      debug_day_plan:
        description: >-
          Optional "from,to[,sport]" (dates YYYY-MM-DD, in this step's own
          Asia/Taipei clock - this repo's own audience's local time, so
          quiet-hours/day-bucketing match what a real viewer sees; sport is
          an exact match.sport value, e.g. "MLB") to fetch a real,
          current matches.json snapshot (via scripts/build-data.mjs) and
          dump the actual computed day plan for that range - see
          scripts/dump-day-plan.mjs's own comment for why this exists
          (tracing a reported scheduling bug against real, current fetched
          data from a run's own job log, the one place this repo's own
          tooling can reach when ESPN/Polymarket aren't directly
          reachable from wherever this is being debugged). Leave empty to
          skip - the normal, default case, and the only thing this
          workflow otherwise does.
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

# Same reasoning as Orbit's static.yml: only one deployment in flight at a
# time, but never cancel one that's already running.
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run tests
        # No runtime dependencies to install (see package.json) - this runs
        # the scoring/viewing-plan/evaluator unit tests (tests/, node:test)
        # against every push/dispatch, so a bad change to
        # public/lib/recommendation.mjs or public/lib/match-builder.mjs's
        # pure helpers fails here before it ever reaches a live deploy.
        run: npm test
      - name: 'Debug: build a snapshot and dump the computed day plan'
        # Opt-in only (see the workflow_dispatch input's own comment) -
        # never runs on a routine push, so this adds nothing to the normal
        # deploy's own log noise or runtime. Runs scripts/build-data.mjs
        # (the Node CLI wrapper around public/lib/match-builder.mjs) first
        # to get a real, current matches.json for dump-day-plan.mjs to read
        # - this workflow no longer builds one on every run the way it used
        # to, so the debug step has to ask for its own fresh copy.
        if: ${{ github.event.inputs.debug_day_plan != '' }}
        env:
          TZ: Asia/Taipei
          DEBUG_DAY_PLAN: ${{ github.event.inputs.debug_day_plan }}
        run: |
          node scripts/build-data.mjs
          IFS=',' read -r FROM TO SPORT <<< "$DEBUG_DAY_PLAN"
          node scripts/dump-day-plan.mjs "$FROM" "$TO" "$SPORT"
      - name: Cache-bust index.html's own script/stylesheet references
        # GitHub Pages serves every static file (including app.js/
        # styles.css themselves) with Cache-Control: max-age=600 - not
        # configurable, GitHub Pages has no equivalent of a custom
        # _headers file - so a viewer's browser can keep running JS/CSS
        # from BEFORE a real deploy for up to 10 minutes after it ships.
        # This is exactly the gap that let a fix look "not deployed yet"
        # right after shipping it. A plain reload doesn't reliably close
        # it either: the browser can still serve ./app.js from its own
        # cache without even asking the server if that 600s window hasn't
        # elapsed locally.
        #
        # Fixing it needs the URL app.js/styles.css are actually fetched
        # FROM to change on every real deploy, so the browser treats it as
        # a resource it's never cached before - a query string tied to
        # this build's commit sha does that. This only touches the
        # deployed copy in this runner's own working directory (never
        # committed back to git - public/index.html in the repo stays
        # exactly as authored).
        run: |
          sed -i "s|src=\"./app.js\"|src=\"./app.js?v=${{ github.sha }}\"|; s|href=\"./styles.css\"|href=\"./styles.css?v=${{ github.sha }}\"|" public/index.html
      - name: Tag app.js with this build's own id (for the local match-snapshot cache)
        # public/app.js's own APP_BUILD_ID comment explains the full
        # reasoning - short version: a viewer's cached localStorage match
        # snapshot (saveMatchSnapshot/loadMatchSnapshot) is instant-painted
        # BEFORE this load's own real fetch replaces it, so a snapshot built
        # by an OLDER deploy's code needs to be recognizably older, not
        # silently trusted, in case that deploy changed the match/rawMatches
        # shape this one's own rendering code assumes. Same
        # never-committed-back, runner-working-copy-only approach as the
        # cache-busting step above - public/app.js in the repo keeps the
        # literal '__BUILD_ID__' placeholder.
        #
        # public/sw.js gets the same stamp: it names the service worker's
        # per-deploy cache, and changing sw.js's bytes is what makes browsers
        # install the new deploy's worker (see that file's own top comment).
        run: |
          sed -i "s|__BUILD_ID__|${{ github.sha }}|" public/app.js public/sw.js
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
