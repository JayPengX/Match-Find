# Rebuilds public/data/matches.json from live fixtures on a schedule, then
# deploys the whole public/ folder to GitHub Pages. See scripts/build-data.mjs
# for what the build step actually does; this workflow just runs it and wires
# the result to Pages (repo Settings -> Pages -> Source: GitHub Actions).
name: Build match data and deploy to Pages

on:
  schedule:
    # Every 15 minutes - this only costs an ESPN fetch (a free, unauthenticated
    # public API) on most runs: build-data.mjs's own AI_FETCH_MIN_INTERVAL_HOURS
    # throttle is what actually keeps Gemini calls down to a few times a day
    # regardless of how often this workflow itself fires, so running the
    # workflow often is exactly what lets match/live-status data stay fresh
    # without spending any extra AI quota. GitHub Pages is a public repo, so
    # Actions minutes on GitHub-hosted runners aren't metered here either.
    - cron: '*/15 * * * *'
  push:
    branches: ['main']
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

# Same reasoning as Orbit's static.yml: only one deployment in flight at a
# time, but never cancel one that's already running.
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch fixtures and build match recommendations
        env:
          # Base URL of Orbit's shared Cloudflare Worker (no path suffix) -
          # see README's "AI recommendations" section. A repo *variable*,
          # not a secret: it ends up as a plain fetch target in this build
          # step and holds no credential itself (the real Gemini key lives
          # server-side in that Worker, never here). Left unset, the build
          # still runs - see scripts/build-data.mjs's heuristic fallback.
          PROXY_URL: ${{ vars.PROXY_URL }}
          # Lets a tab left open across a deploy tell "the code actually
          # changed" apart from "just a routine scheduled data refresh" -
          # see build-data.mjs's BUILD_ID and public/app.js's update-check
          # polling. A scheduled rerun with no new commit reuses this same
          # sha every time, which is exactly the distinction that matters.
          BUILD_ID: ${{ github.sha }}
          # Lets the build tell a routine scheduled rerun apart from a real
          # code push or a manually-requested run - see build-data.mjs's
          # "throttling how often Gemini gets called" section. A schedule
          # run skips calling the proxy at all when the last real call was
          # recent; a push or workflow_dispatch always calls it, since
          # either means someone specifically wants fresh data now.
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: node scripts/build-data.mjs
      - name: Commit updated AI score cache
        # data/ai-cache.json and data/ai-meta.json (unlike
        # public/data/matches.json, which is fully regenerated every run and
        # never committed) are the persistent record of which matches Gemini
        # has already scored, and when Gemini was last actually called - see
        # build-data.mjs's "AI score cache" section. Committing them back is
        # what makes that state survive between separate scheduled runs, so
        # a match already scored on an earlier run is never re-sent to
        # Gemini. Only commits when something actually changed (a new
        # fixture entered the window, or Gemini was just called), so this
        # doesn't add a commit every single run. contents: write (see
        # permissions above) is what lets this push succeed; a commit made
        # with the default GITHUB_TOKEN never re-triggers this same
        # workflow, so this can't loop.
        run: |
          if ! git diff --quiet -- data/ai-cache.json data/ai-meta.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/ai-cache.json data/ai-meta.json
            git commit -m "Update AI score cache"
            git fetch origin "${{ github.ref_name }}"
            git rebase "origin/${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
          else
            echo "AI score cache unchanged - nothing to commit."
          fi
      - name: Cache-bust index.html's own script/stylesheet references
        # GitHub Pages serves every static file (including app.js/
        # styles.css themselves) with Cache-Control: max-age=600 - not
        # configurable, GitHub Pages has no equivalent of a custom
        # _headers file - so a viewer's browser can keep running JS/CSS
        # from BEFORE a real deploy for up to 10 minutes even after
        # matches.json itself (fetched with cache: 'no-store', see
        # app.js) is already fresh. This is exactly the gap that let a fix
        # look "not deployed yet" right after shipping it. A plain reload
        # doesn't reliably close it either: the browser can still serve
        # ./app.js from its own cache without even asking the server if
        # that 600s window hasn't elapsed locally.
        #
        # Fixing it needs the URL app.js/styles.css are actually fetched
        # FROM to change on every real deploy, so the browser treats it as
        # a resource it's never cached before - a query string tied to
        # this build's commit sha does that. This only touches the
        # deployed copy in this runner's own working directory (never
        # committed back to git - public/index.html in the repo stays
        # exactly as authored, same posture as public/data/matches.json
        # never being committed either).
        run: |
          sed -i "s|src=\"./app.js\"|src=\"./app.js?v=${{ github.sha }}\"|; s|href=\"./styles.css\"|href=\"./styles.css?v=${{ github.sha }}\"|" public/index.html
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
