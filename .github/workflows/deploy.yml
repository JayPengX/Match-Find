# Rebuilds public/data/matches.json from live fixtures on a schedule, then
# deploys the whole public/ folder to GitHub Pages. See scripts/build-data.mjs
# for what the build step actually does; this workflow just runs it and wires
# the result to Pages (repo Settings -> Pages -> Source: GitHub Actions).
name: Build match data and deploy to Pages

on:
  schedule:
    # Every 15 minutes - this only costs an ESPN fetch (a free, unauthenticated
    # public API); the objective-score recompute itself is free and local
    # (see scripts/objective-score.mjs - no AI/external scoring call of any
    # kind since docs/recommendation-engine-audit.md's Round 11). GitHub
    # Pages is a public repo, so Actions minutes on GitHub-hosted runners
    # aren't metered here either.
    - cron: '*/15 * * * *'
  push:
    branches: ['main']
  workflow_dispatch:
    inputs:
      debug_day_plan:
        description: >-
          Optional "from,to[,sport]" (dates YYYY-MM-DD, in this step's own
          Asia/Taipei clock - this repo's own audience's local time, so
          quiet-hours/day-bucketing match what a real viewer sees; sport is
          an exact match.sport value, e.g. "MLB") to dump the actual
          computed day plan for that range - see scripts/dump-day-plan.mjs's
          own comment for why this exists (tracing a reported scheduling
          bug against real, current fetched data from a run's own job log,
          the one place this repo's own tooling can reach when the deployed
          site/ESPN/the build artifact itself aren't directly reachable).
          Leave empty to skip - the normal, default case.
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

# Same reasoning as Orbit's static.yml: only one deployment in flight at a
# time, but never cancel one that's already running.
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run tests
        # No runtime dependencies to install (see package.json) - this runs
        # the scoring/viewing-plan/evaluator unit tests (tests/, node:test)
        # against every push/schedule/dispatch, same as the build step right
        # after it - a bad change to public/lib/recommendation.mjs or
        # scripts/build-data.mjs's pure helpers fails here before it ever
        # reaches a live deploy.
        run: npm test
      - name: Fetch fixtures and build match recommendations
        env:
          # Base URL of the shared Cloudflare Worker (no path suffix) - see
          # README's "Live score/odds polling and manual refresh" section.
          # A repo *variable*, not a secret: it ends up as a plain value in
          # the output matches.json for the BROWSER to build its own
          # /sports-proxy and /match-dispatch requests from - this build
          # step itself doesn't call the proxy for anything (no AI/external
          # scoring call of any kind - see build-data.mjs's own top
          # comment). Left unset, the build still runs, just without those
          # two browser-side features.
          PROXY_URL: ${{ vars.PROXY_URL }}
          # Lets a tab left open across a deploy tell "the code actually
          # changed" apart from "just a routine scheduled data refresh" -
          # see build-data.mjs's BUILD_ID and public/app.js's update-check
          # polling. A scheduled rerun with no new commit reuses this same
          # sha every time, which is exactly the distinction that matters.
          BUILD_ID: ${{ github.sha }}
        run: node scripts/build-data.mjs
      - name: 'Debug: dump computed day plan'
        # Opt-in only (see the workflow_dispatch input's own comment) - never
        # runs on a routine schedule/push, so this adds nothing to the
        # normal deploy's own log noise or runtime.
        if: ${{ github.event.inputs.debug_day_plan != '' }}
        env:
          TZ: Asia/Taipei
          DEBUG_DAY_PLAN: ${{ github.event.inputs.debug_day_plan }}
        run: |
          IFS=',' read -r FROM TO SPORT <<< "$DEBUG_DAY_PLAN"
          node scripts/dump-day-plan.mjs "$FROM" "$TO" "$SPORT"
      - name: Cache-bust index.html's own script/stylesheet references
        # GitHub Pages serves every static file (including app.js/
        # styles.css themselves) with Cache-Control: max-age=600 - not
        # configurable, GitHub Pages has no equivalent of a custom
        # _headers file - so a viewer's browser can keep running JS/CSS
        # from BEFORE a real deploy for up to 10 minutes even after
        # matches.json itself (fetched with cache: 'no-store', see
        # app.js) is already fresh. This is exactly the gap that let a fix
        # look "not deployed yet" right after shipping it. A plain reload
        # doesn't reliably close it either: the browser can still serve
        # ./app.js from its own cache without even asking the server if
        # that 600s window hasn't elapsed locally.
        #
        # Fixing it needs the URL app.js/styles.css are actually fetched
        # FROM to change on every real deploy, so the browser treats it as
        # a resource it's never cached before - a query string tied to
        # this build's commit sha does that. This only touches the
        # deployed copy in this runner's own working directory (never
        # committed back to git - public/index.html in the repo stays
        # exactly as authored, same posture as public/data/matches.json
        # never being committed either).
        run: |
          sed -i "s|src=\"./app.js\"|src=\"./app.js?v=${{ github.sha }}\"|; s|href=\"./styles.css\"|href=\"./styles.css?v=${{ github.sha }}\"|" public/index.html
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
