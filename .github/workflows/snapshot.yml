# Rebuilds the prebuilt match-list snapshot (scripts/build-snapshot.mjs) and
# publishes it as matches.json on this repo's `data` branch, which the page
# fetches from raw.githubusercontent.com on load (see public/app.js,
# SERVER_SNAPSHOT_URL) so a viewer sees a complete match list after ONE
# small request instead of waiting on ~80 proxied API calls. The page still
# does its own live build right after, exactly as before - this only removes
# the wait for the first screen.
#
# Every 5 minutes, reliably: GitHub's own `schedule` trigger is best-effort
# - a `*/5` cron was observed not firing at all for its first 40+ minutes,
# and it routinely runs late or skips under load. So instead of one short
# run per tick, each run LOOPS: build + publish, wait until 5 minutes after
# that iteration started, repeat, for up to LOOP_SECONDS (just under the
# 6-hour job limit). The hourly `schedule` only has to keep a next run
# queued: while a loop is running, a scheduled run waits as "pending" (at
# most one - GitHub replaces an older pending run with a newer one) and
# starts the moment the current loop ends, so an occasional skipped or late
# cron costs nothing. A push to main (or a manual dispatch) instead CANCELS
# the running loop and starts a new one right away - a new deploy's page
# only accepts a snapshot built by its own commit (buildId), so it needs one
# within a minute, not whenever the old loop happens to end. Public repo,
# so these Actions minutes are free.
#
# `data` is force-pushed as a single orphan commit every run, so it never
# accumulates history. Pushing it doesn't trigger deploy.yml (main only).
name: Build match snapshot

on:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 'match-snapshot'
  # See the top comment: only a push/dispatch replaces a running loop; a
  # scheduled run queues behind it.
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    env:
      INTERVAL_SECONDS: 300
      LOOP_SECONDS: 20700 # 5h45m - leaves the last iteration room inside timeout-minutes
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build and publish every 5 minutes
        # Each iteration: build (scripts/build-snapshot.mjs), stamp it with
        # this commit's sha as buildId - the same sha deploy.yml stamps into
        # the deployed app.js as APP_BUILD_ID, so the page never feeds one
        # deploy's rendering code another deploy's data shape - and
        # force-push it as the `data` branch's single commit. A failed build
        # (an upstream API having a bad moment) just skips that publish and
        # keeps the previous snapshot; the loop carries on.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          SHA=$(git rev-parse HEAD)
          END=$(( $(date +%s) + LOOP_SECONDS ))
          publish() {
            rm -rf publish && mkdir publish && cp snapshot/matches.json publish/
            (
              cd publish
              git init -q -b data
              git config user.name 'github-actions[bot]'
              git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              git add matches.json
              git commit -q -m "Match snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
              git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" data
            )
          }
          while :; do
            STARTED=$(date +%s)
            if node scripts/build-snapshot.mjs snapshot/matches.json \
              && node -e "const fs=require('fs');const p='snapshot/matches.json';const d=JSON.parse(fs.readFileSync(p,'utf8'));d.buildId=process.argv[1];fs.writeFileSync(p,JSON.stringify(d))" "$SHA"; then
              publish && echo "Published at $(date -u +%H:%M:%S)" || echo "::warning::Publish failed; will retry next iteration"
            else
              echo "::warning::Build failed; keeping the last published snapshot"
            fi
            NEXT=$(( STARTED + INTERVAL_SECONDS ))
            [ "$NEXT" -ge "$END" ] && break
            WAIT=$(( NEXT - $(date +%s) ))
            [ "$WAIT" -gt 0 ] && sleep "$WAIT"
          done
